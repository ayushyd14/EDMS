<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20190405/ourlarge/pngtree-letter-e-3d-company-logo-design-png-image_901868.jpg">
    <title>Projects | Edeonaut DMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo"><a href="../index.html"><img style="width: 235px;" src="../pn54.png"></a></div>

        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="dropdown">
                <span class="drop-label">Databases &#9662;</span>
                <ul class="dropdown-menu">
                    <li><a href="../index.html">Employee Database</a></li>
                    <li><a href="server-database.html">Server Database</a></li>
                    <li><a href="clients.html">Clients</a></li>
                    <li><a href="departments.html">Departments</a></li>
                    <li><a href="assets.html">Assets</a></li>
                </ul>
            </li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="commits.html">Pull Requests &amp; Commits</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="investors.html">Investors</a></li>
        </ul>
    </nav>


    <div class="container wide">
        <div class="col-1">
            <form id="form" autocomplete="off">
                <div>
                    <label>Codename</label>
                    <input type="text" name="codename" id="codename" placeholder="e.g. MAGMA">
                </div>
                <div>
                    <label>Project Name</label>
                    <input type="text" name="projectName" id="projectName">
                </div>
                <div>
                    <label>Project Lead</label>
                    <input type="text" name="lead" id="lead" placeholder="Employee name">
                </div>
                <div>
                    <label>Priority</label>
                    <select name="priority" id="priority">
                        <option value="">Select...</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Critical</option>
                    </select>
                </div>
                <div>
                    <label>Status</label>
                    <select name="status" id="status">
                        <option value="">Select...</option>
                        <option>Planning</option>
                        <option>Active</option>
                        <option>On Hold</option>
                        <option>Completed</option>
                    </select>
                </div>
                <div>
                    <label>Progress (%)</label>
                    <input type="number" name="progress" id="progress" min="0" max="100" step="any">
                </div>
                <div>
                    <label>Deadline</label>
                    <input type="date" name="deadline" id="deadline">
                </div>
                <div class="action-button">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>


        <div class="col-2">
            <table class="list" id="projectList">
                <thead>
                    <tr>
                        <th>Codename</th>
                        <th>Project</th>
                        <th>Lead</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Progress (%)</th>
                        <th>Deadline</th>
                        <th>Edit/Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>



    <script src="../js/crud.js"></script>
    <script src="../js/projects.js"></script>
</body>
</html>
