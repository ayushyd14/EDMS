<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20190405/ourlarge/pngtree-letter-e-3d-company-logo-design-png-image_901868.jpg">
    <title>Chat | Edeonaut DMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo"><a href="../index.html"><img style="width: 235px;" src="../pn55.png"></a></div>
        
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="dropdown">
                <span class="drop-label">Databases &#9662;</span>
                <ul class="dropdown-menu">
                    <li><a href="../index.html">Employee Database</a></li>
                    <li><a href="server-database.html">Server Database</a></li>
                    <li><a href="clients.html">Clients</a></li>
                    <li><a href="departments.html">Departments</a></li>
                    <li><a href="assets.html">Assets</a></li>
                </ul>
            </li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="commits.html">Pull Requests &amp; Commits</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="investors.html">Investors</a></li>
        </ul>
    </nav>


    <div class="container">
        <div class="col-1 chat-side">
            <label>Filter</label>
            <input type="text" id="filterInput" placeholder="Search employees, investors or groups" autocomplete="off">
            <button type="button" id="newGroup" class="chat-btn new-group-btn">+ New Group</button>
            <ul class="contact-list" id="contactList"></ul>
        </div>


        <div class="col-2 chat-main">
            <div class="chat-header">
                <div class="chat-person">
                    <span class="avatar avatar-lg" id="chatAvatar"></span>
                    <div>
                        <div class="chat-title" id="chatTitle"></div>
                        <div class="chat-sub" id="chatSub" hidden></div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button type="button" id="editGroup" class="chat-btn" hidden>Edit Group</button>
                    <button type="button" id="deleteGroup" class="chat-btn" hidden>Delete Group</button>
                    <button type="button" id="clearChat" class="chat-btn">Clear Chat</button>
                </div>
            </div>

            <div class="chat-box" id="chatBox"></div>
            <div class="typing" id="typing"></div>

            <form class="chat-form" id="chatForm" autocomplete="off">
                <input type="text" id="messageInput" maxlength="500" placeholder="Type a message...">
                <button type="submit" class="chat-btn">Send</button>
            </form>
        </div>
    </div>


    <div class="modal" id="groupModal" hidden>
        <div class="modal-box">
            <div class="modal-title" id="groupModalTitle">New Group</div>

            <label>Group Name</label>
            <input type="text" id="groupName" maxlength="40" placeholder="e.g. German-French Branch" autocomplete="off">

            <label>Members <span class="selected-count" id="selectedCount"></span></label>
            <input type="text" id="memberFilter" placeholder="Filter by name, code, country or company" autocomplete="off">

            <div class="member-tools">
                <button type="button" id="selectShown" class="chat-btn small">Select shown</button>
                <button type="button" id="clearMembers" class="chat-btn small">Clear</button>
            </div>

            <div class="member-list" id="memberList"></div>

            <div class="modal-actions">
                <button type="button" id="cancelGroup" class="chat-btn">Cancel</button>
                <button type="button" id="saveGroup" class="chat-btn">Save Group</button>
            </div>
        </div>
    </div>



    <script src="../js/chat.js"></script>
</body>
</html>
