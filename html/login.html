<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20190405/ourlarge/pngtree-letter-e-3d-company-logo-design-png-image_901868.jpg">
    <title>Login | Edeonaut DMS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js" data-public></script>
</head>

<body class="login-page">

    <div class="login-card">
        <img class="login-logo" src="../pn54.png" alt="Edeonaut">
        <div class="login-title" id="loginTitle">Employee Login</div>

        <form id="loginForm" autocomplete="off">
            <div>
                <label>Emp Name</label>
                <input type="text" id="loginName">
            </div>
            <div>
                <label>Emp Code</label>
                <input type="text" id="loginCode">
            </div>
            <div>
                <label>Date of Joining</label>
                <input type="date" id="loginDoj">
            </div>
            <div class="form-error" id="loginError" hidden></div>
            <input type="submit" value="Log in">
        </form>

        <form id="setupForm" autocomplete="off" hidden>
            <div>
                <label>Emp Name</label>
                <input type="text" id="setupName">
            </div>
            <div>
                <label>Emp Code</label>
                <input type="text" id="setupCode">
            </div>
            <div>
                <label>Designation</label>
                <input type="text" id="setupDesignation">
            </div>
            <div>
                <label>Country</label>
                <input type="text" id="setupCountry">
            </div>
            <div>
                <label>Date of Joining</label>
                <input type="date" id="setupDoj">
            </div>
            <div>
                <label>Salary (in $)</label>
                <input type="number" id="setupSalary" min="0">
            </div>
            <div class="form-error" id="setupError" hidden></div>
            <input type="submit" value="Create account">
        </form>

        <div class="login-note" id="loginNote"></div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
