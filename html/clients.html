<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20190405/ourlarge/pngtree-letter-e-3d-company-logo-design-png-image_901868.jpg">
    <title>Clients | Edeonaut DMS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo"><a href="../index.html"><img style="width: 235px;" src="../pn54.png"></a></div>

        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="dropdown">
                <span class="drop-label">Databases &#9662;</span>
                <ul class="dropdown-menu">
                    <li><a href="../index.html">Employee Database</a></li>
                    <li><a href="server-database.html">Server Database</a></li>
                    <li><a href="clients.html">Clients</a></li>
                    <li><a href="departments.html">Departments</a></li>
                    <li><a href="assets.html">Assets</a></li>
                </ul>
            </li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="commits.html">Pull Requests &amp; Commits</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="investors.html">Investors</a></li>
        </ul>
    </nav>


    <div class="container wide">
        <div class="col-1">
            <form id="form" autocomplete="off">
                <div>
                    <label>Client Name</label>
                    <input type="text" name="clientName" id="clientName">
                </div>
                <div>
                    <label>Industry</label>
                    <input type="text" name="industry" id="industry">
                </div>
                <div>
                    <label>Country</label>
                    <input type="text" name="country" id="country">
                </div>
                <div>
                    <label>Contact Person</label>
                    <input type="text" name="contactPerson" id="contactPerson">
                </div>
                <div>
                    <label>Contract Value (in $)</label>
                    <input type="number" name="contractValue" id="contractValue" min="0">
                </div>
                <div>
                    <label>Status</label>
                    <select name="status" id="status">
                        <option value="">Select...</option>
                        <option>Active</option>
                        <option>Prospect</option>
                        <option>Churned</option>
                    </select>
                </div>
                <div class="action-button">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>


        <div class="col-2">
            <table class="list" id="clientList">
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Industry</th>
                        <th>Country</th>
                        <th>Contact Person</th>
                        <th>Contract ($)</th>
                        <th>Status</th>
                        <th>Edit/Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>



    <script src="../js/crud.js"></script>
    <script src="../js/clients.js"></script>
</body>
</html>
