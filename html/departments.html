    <title>Departments | Edeonaut DMS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo"><a href="../index.html"><img style="width: 235px;" src="../pn54.png"></a></div>

        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li class="dropdown">
                <span class="drop-label">Databases &#9662;</span>
                <ul class="dropdown-menu">
                    <li><a href="../index.html">Employee Database</a></li>
                    <li><a href="server-database.html">Server Database</a></li>
                    <li><a href="clients.html">Clients</a></li>
                    <li><a href="departments.html">Departments</a></li>
                    <li><a href="assets.html">Assets</a></li>
                </ul>
            </li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="commits.html">Pull Requests &amp; Commits</a></li>
            <li><a href="chat.html">Chat</a></li>
            <li><a href="investors.html">Investors</a></li>
        </ul>
    </nav>


    <div class="container">
        <div class="col-1">
            <form id="form" autocomplete="off">
                <div>
                    <label>Department Name</label>
                    <input type="text" name="deptName" id="deptName">
                </div>
                <div>
                    <label>Department Code</label>
                    <input type="text" name="deptCode" id="deptCode" placeholder="e.g. ENG">
                </div>
                <div>
                    <label>Head of Department</label>
                    <input type="text" name="head" id="head">
                </div>
                <div>
                    <label>Location</label>
                    <input type="text" name="location" id="location">
                </div>
                <div>
                    <label>Annual Budget (in $)</label>
                    <input type="number" name="budget" id="budget" min="0">
                </div>
                <div class="action-button">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>


        <div class="col-2">
            <table class="list" id="departmentList">
                <thead>
                    <tr>
                        <th>Department</th>
                        <th>Code</th>
                        <th>Head</th>
                        <th>Location</th>
                        <th>Budget ($)</th>
                        <th>Edit/Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>



    <script src="../js/crud.js"></script>
    <script src="../js/departments.js"></script>
</body>
</html>
