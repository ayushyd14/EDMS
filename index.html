<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-clipart/20190405/ourlarge/pngtree-letter-e-3d-company-logo-design-png-image_901868.jpg">
    <title>Edeonaut DMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo"><a href="#"><img style="width: 235px;" src="pn54.png"></a></div>
        
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="index.html">Employee Database</a></li>
            <li><a href="server-database.html">Server Database</a></li>
            <li><a href="commits.html">Pull Requests &amp; Commits</a></li>
            <li><a href="chat.html">Chat</a></li>
        </ul>
    </nav>


    <div class="container">
        <div class="col-1">
            <form id="form" autocomplete="off">
                <div>
                    <label>Full Name</label>
                    <input type="text" name="fullName" id="fullName">
                </div>
                <div>
                    <label>Emp Code</label>
                    <input type="text" name="empCode" id="empCode">
                </div>
                <div>
                    <label>Country</label>
                    <input type="text" name="country" id="country">
                </div>
                <div>
                    <label>Salary (in $)</label>
                    <input type="number" name="salary" id="salary">
                </div>
                <div class="action-button">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>


        <div class="col-2">
            <table class="list" id="employeeList">
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Emp Code</th>
                        <th>Country</th>
                        <th>Salary</th>
                        <th>Edit/Delete</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>



    <script src="script.js"></script>
